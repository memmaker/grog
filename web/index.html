<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grog</title>
<link rel="icon" href="data:,">
<meta name="description" content="Play Grog, Thomas Biskup's 2018 roguelike, in your browser.">
<style>
	:root { --bg: #0b0b0d; --panel: #16161a; --line: #2b2b33; --text: #d8d8de; --dim: #8a8a96; --accent: #d9b24c; --gut: #1d1d23; --gut-hover: #d9b24c; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
	#bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); height: 32px; white-space: nowrap; overflow: hidden; }
	#bar h1 { font-size: 14px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .04em; }
	#bar .sp { flex: 1; }
	#bar .hint { color: var(--dim); }
	button { background: #22222a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; font: inherit; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	#status { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; max-width: 90vw; }
	#status.error { border-color: #b44; color: #f99; }
	#status[hidden], #game[hidden], #overlay[hidden] { display: none; }
	#game { position: absolute; left: 0; right: 0; top: 32px; bottom: 0; overflow: hidden; background: var(--gut); }
	.win { position: absolute; background: #000; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
	.win > .t { flex: none; display: flex; align-items: center; font-size: 11px; height: 20px; padding: 0 2px 0 6px; background: var(--panel); color: var(--dim); border-bottom: 1px solid var(--line); }
	.win > .t .name { flex: 1; }
	.win > .body { flex: 1; min-height: 0; overflow: hidden; position: relative; }
	.win > .body canvas { display: block; position: absolute; }
	#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 10; }
	.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; max-width: 560px; }
	.card h2 { margin: 0 0 10px; font-size: 16px; color: var(--accent); }
</style>
</head>
<body>
<div id="bar">
	<h1>Grog</h1>
	<button id="btn-layout" title="Windows: layout, show and hide">Windows ▾</button>
	<span class="sp"></span>
	<span class="hint">h help · Esc game menu</span>
</div>
<div id="status">Loading Grog…</div>
<div id="game" hidden>
	<div class="win" id="t-map"><div class="t"><span class="name">Map</span></div><div class="body" id="map"><canvas></canvas></div></div>
</div>
<div id="overlay" hidden><div class="card"><h2>Grog has ended</h2><p>Your files are stored in this browser.</p><button id="btn-restart">Play again</button></div></div>
<script src="../rvip-wm.js"></script>
<script src="../rvip-app.js"></script>
<script type="module" src="grog.js"></script>
</body>
</html>
